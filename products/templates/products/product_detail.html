{% extends "base.html" %}

{% block title %}{{ product.name }} – Список покупок{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h3 card-title">{{ product.name }}</h1>
        <p class="card-text">Количество: {{ product.quantity }}</p>
        <a
            href="{% url 'products:list' %}"
            class="btn btn-outline-secondary"
        >
            К списку товаров
        </a>
    </div>
</div>
{% endblock %}
