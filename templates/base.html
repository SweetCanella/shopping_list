{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="site-header border-bottom mb-4">
        <div class="container py-3 d-flex align-items-center gap-3">
            <img
                src="{% static 'homepage/img/logo.svg' %}"
                alt="Список покупок"
                width="48"
                height="48"
            >
            <p class="h4 mb-0">{{ site_name }}</p>
        </div>
        {% include "homepage/includes/navigation.html" %}
    </header>
    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>
    <footer class="border-top py-3">
        <div class="container text-muted">
            Система формирования списка покупок,
            <span id="current-year"></span>
        </div>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
